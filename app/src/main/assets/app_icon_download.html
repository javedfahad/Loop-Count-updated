<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoopCount App Icon (512x512)</title>
    <style>
        body {
            margin: 0;
            padding: 40px;
            background: #121212;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }
        .container {
            text-align: center;
            max-width: 600px;
        }
        .preview-card {
            background: #1e1e1e;
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            display: inline-block;
            margin: 20px 0;
            border: 1px solid #333;
        }
        canvas {
            border-radius: 96px; /* Smooth squircle effect */
            box-shadow: 0 12px 32px rgba(124, 77, 255, 0.35);
        }
        .btn {
            background: linear-gradient(135deg, #7C4DFF, #E040FB);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(224, 64, 251, 0.4);
        }
        .btn:hover {
            transform: scale(1.04);
            box-shadow: 0 6px 22px rgba(224, 64, 251, 0.6);
        }
        .info {
            color: #aaa;
            font-size: 14px;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>LoopCount — Play Store Icon</h1>
        <p>Exact 512 x 512 px 32-bit PNG ready for Google Play Console</p>
        
        <div class="preview-card">
            <canvas id="iconCanvas" width="512" height="512"></canvas>
        </div>

        <div>
            <button id="downloadBtn" class="btn">⬇ Download 512x512 Icon PNG</button>
        </div>
        <p class="info">Click the button above to immediately save <code>loopcount_app_icon_512.png</code> to your device.</p>
    </div>

    <script>
        const canvas = document.getElementById('iconCanvas');
        const ctx = canvas.getContext('2d');

        // Draw High-Res 512x512 App Icon
        function drawIcon() {
            // Background Gradient (Deep obsidian royal purple)
            const bgGradient = ctx.createLinearGradient(0, 0, 512, 512);
            bgGradient.addColorStop(0, '#2A0845');
            bgGradient.addColorStop(0.5, '#1A042B');
            bgGradient.addColorStop(1, '#0D0017');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, 512, 512);

            // Vinyl radial background glow
            const radial = ctx.createRadialGradient(256, 256, 10, 256, 256, 220);
            radial.addColorStop(0, 'rgba(60, 16, 105, 0.8)');
            radial.addColorStop(0.7, 'rgba(33, 0, 93, 0.4)');
            radial.addColorStop(1, 'rgba(13, 0, 23, 0)');
            ctx.fillStyle = radial;
            ctx.beginPath();
            ctx.arc(256, 256, 220, 0, Math.PI * 2);
            ctx.fill();

            // Vinyl groove rings
            ctx.strokeStyle = 'rgba(79, 55, 139, 0.35)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(256, 256, 180, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(56, 30, 114, 0.4)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(256, 256, 140, 0, Math.PI * 2);
            ctx.stroke();

            // Turntable center core disc
            const discGrad = ctx.createLinearGradient(190, 190, 320, 320);
            discGrad.addColorStop(0, '#311154');
            discGrad.addColorStop(1, '#1A042B');
            ctx.fillStyle = discGrad;
            ctx.beginPath();
            ctx.arc(256, 256, 75, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#7C4DFF';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Glowing Loop Arc (Cyan -> Violet -> Electric Magenta)
            ctx.save();
            ctx.shadowColor = '#00E5FF';
            ctx.shadowBlur = 20;

            const arcGrad = ctx.createLinearGradient(140, 320, 380, 140);
            arcGrad.addColorStop(0, '#00E5FF');
            arcGrad.addColorStop(0.45, '#7C4DFF');
            arcGrad.addColorStop(0.75, '#D0BCFF');
            arcGrad.addColorStop(1, '#E040FB');

            ctx.strokeStyle = arcGrad;
            ctx.lineWidth = 20;
            ctx.lineCap = 'round';
            ctx.beginPath();
            // Arc from ~130 deg to 350 deg
            ctx.arc(256, 256, 105, 0.7 * Math.PI, 1.95 * Math.PI);
            ctx.stroke();
            ctx.restore();

            // Top-right arrowhead
            ctx.save();
            ctx.fillStyle = '#E040FB';
            ctx.shadowColor = '#E040FB';
            ctx.shadowBlur = 18;
            ctx.beginPath();
            ctx.moveTo(345, 145);
            ctx.lineTo(395, 205);
            ctx.lineTo(325, 215);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            // Bottom-left counter arrowhead
            ctx.save();
            ctx.fillStyle = '#00E5FF';
            ctx.shadowColor = '#00E5FF';
            ctx.shadowBlur = 18;
            ctx.beginPath();
            ctx.moveTo(170, 335);
            ctx.lineTo(120, 310);
            ctx.lineTo(155, 270);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            // Soundwave Bar - Left
            ctx.save();
            ctx.strokeStyle = '#00E5FF';
            ctx.lineWidth = 10;
            ctx.lineCap = 'round';
            ctx.shadowColor = '#00E5FF';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.moveTo(205, 230);
            ctx.lineTo(205, 282);
            ctx.stroke();
            ctx.restore();

            // Soundwave Bar - Right
            ctx.save();
            ctx.strokeStyle = '#E040FB';
            ctx.lineWidth = 10;
            ctx.lineCap = 'round';
            ctx.shadowColor = '#E040FB';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.moveTo(307, 225);
            ctx.lineTo(307, 287);
            ctx.stroke();
            ctx.restore();

            // Center White/Lavender Playhead Apex
            ctx.save();
            const playGrad = ctx.createLinearGradient(235, 220, 290, 290);
            playGrad.addColorStop(0, '#FFFFFF');
            playGrad.addColorStop(1, '#EADDFF');
            ctx.fillStyle = playGrad;
            ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
            ctx.shadowBlur = 16;
            ctx.beginPath();
            ctx.moveTo(240, 215);
            ctx.lineTo(290, 256);
            ctx.lineTo(240, 297);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            // Center spindle micro-dot
            ctx.fillStyle = '#381E72';
            ctx.beginPath();
            ctx.arc(256, 256, 6, 0, Math.PI * 2);
            ctx.fill();
        }

        drawIcon();

        // Download trigger
        document.getElementById('downloadBtn').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'loopcount_app_icon_512.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
