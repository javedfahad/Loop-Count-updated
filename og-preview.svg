<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0812" />
      <stop offset="50%" stop-color="#140E24" />
      <stop offset="100%" stop-color="#07050D" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#8A2BE2" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#8A2BE2" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FF007A" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="150" r="180" fill="#00F0FF" opacity="0.08" filter="url(#glow)" />
  <circle cx="1000" cy="480" r="220" fill="#FF007A" opacity="0.09" filter="url(#glow)" />
  <circle cx="600" cy="550" r="250" fill="#8A2BE2" opacity="0.12" filter="url(#glow)" />

  <!-- Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="url(#glowGrad)" stroke-width="2" />

  <!-- Header Category Pill -->
  <rect x="425" y="70" width="350" height="42" rx="21" fill="#1A152E" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.4" />
  <text x="600" y="97" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#00F0FF" text-anchor="middle" letter-spacing="2">✦ PRECISION AUDIO ENGINE</text>

  <!-- Logo Mark -->
  <g transform="translate(536, 140)">
    <rect width="128" height="128" rx="36" fill="url(#neonGrad)" filter="url(#glow)" />
    <!-- Loop Infinity with music rings -->
    <path d="M88 48 C104 48 104 80 88 80 C74 80 66 48 40 48 C24 48 24 80 40 80 C54 80 62 48 88 48 Z" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="40" cy="64" r="6" fill="#00F0FF" />
    <circle cx="88" cy="64" r="6" fill="#FF007A" />
  </g>

  <!-- Title -->
  <text x="600" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">Loopify Music</text>
  <text x="600" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#D4CEE2" text-anchor="middle">Precision Audio Looper • Set Ringtone • 100% Offline</text>

  <!-- Sound Waveform visual bars -->
  <g transform="translate(360, 410)">
    <rect x="0" y="20" width="6" height="30" rx="3" fill="#00F0FF" opacity="0.6" />
    <rect x="16" y="10" width="6" height="50" rx="3" fill="#00F0FF" />
    <rect x="32" y="2" width="6" height="66" rx="3" fill="#00F0FF" />
    <rect x="48" y="16" width="6" height="38" rx="3" fill="#8A2BE2" />
    <rect x="64" y="24" width="6" height="22" rx="3" fill="#8A2BE2" />
    <rect x="80" y="6" width="6" height="58" rx="3" fill="#8A2BE2" />
    <rect x="96" y="0" width="6" height="70" rx="3" fill="#FF007A" />
    <rect x="112" y="14" width="6" height="42" rx="3" fill="#FF007A" />
    <rect x="128" y="22" width="6" height="26" rx="3" fill="#00F0FF" />
    <rect x="144" y="8" width="6" height="54" rx="3" fill="#00F0FF" />
    <rect x="160" y="18" width="6" height="34" rx="3" fill="#8A2BE2" />
    <rect x="176" y="4" width="6" height="62" rx="3" fill="#FF007A" />
    <rect x="192" y="14" width="6" height="42" rx="3" fill="#FF007A" />
    <rect x="208" y="26" width="6" height="18" rx="3" fill="#00F0FF" />
    <rect x="224" y="10" width="6" height="50" rx="3" fill="#00F0FF" />
    <rect x="240" y="0" width="6" height="70" rx="3" fill="#8A2BE2" />
    <rect x="256" y="12" width="6" height="46" rx="3" fill="#FF007A" />
    <rect x="272" y="20" width="6" height="30" rx="3" fill="#FF007A" />
    <rect x="288" y="6" width="6" height="58" rx="3" fill="#00F0FF" />
    <rect x="304" y="16" width="6" height="38" rx="3" fill="#00F0FF" />
    <rect x="320" y="2" width="6" height="66" rx="3" fill="#8A2BE2" />
    <rect x="336" y="12" width="6" height="46" rx="3" fill="#8A2BE2" />
    <rect x="352" y="22" width="6" height="26" rx="3" fill="#FF007A" />
    <rect x="368" y="8" width="6" height="54" rx="3" fill="#FF007A" />
    <rect x="384" y="2" width="6" height="66" rx="3" fill="#00F0FF" />
    <rect x="400" y="16" width="6" height="38" rx="3" fill="#00F0FF" />
    <rect x="416" y="24" width="6" height="22" rx="3" fill="#8A2BE2" />
    <rect x="432" y="10" width="6" height="50" rx="3" fill="#FF007A" />
    <rect x="448" y="20" width="6" height="30" rx="3" fill="#FF007A" />
    <rect x="464" y="28" width="6" height="14" rx="3" fill="#00F0FF" opacity="0.6" />
  </g>

  <!-- Feature Highlights Row -->
  <g transform="translate(180, 515)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="190" height="42" rx="12" fill="#1C152E" stroke="#382C56" />
    <text x="95" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#00F0FF" text-anchor="middle">Exact Count Loops</text>

    <!-- Pill 2 -->
    <rect x="210" y="0" width="190" height="42" rx="12" fill="#1C152E" stroke="#382C56" />
    <text x="305" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FF007A" text-anchor="middle">Trim Song Ringtone</text>

    <!-- Pill 3 -->
    <rect x="420" y="0" width="200" height="42" rx="12" fill="#1C152E" stroke="#382C56" />
    <text x="520" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#B388FF" text-anchor="middle">Zero-Duplicate Playlists</text>

    <!-- Pill 4 -->
    <rect x="640" y="0" width="200" height="42" rx="12" fill="#1C152E" stroke="#382C56" />
    <text x="740" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#00FFB2" text-anchor="middle">100% Offline &amp; Free</text>
