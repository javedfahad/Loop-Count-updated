  <g transform="translate(195, 960)">
    <rect x="0" y="0" width="150" height="44" rx="22" fill="#D2002E" />
    <!-- 811 Circle inside pill -->
    <circle cx="28" cy="22" r="14" fill="#FFFFFF" />
    <text x="28" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" fill="#D2002E" text-anchor="middle">811</text>
