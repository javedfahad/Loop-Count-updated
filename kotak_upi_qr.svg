<svg width="540" height="1170" viewBox="0 0 540 1170" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="kotakCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#240711" />
      <stop offset="45%" stop-color="#4E081B" />
      <stop offset="75%" stop-color="#8E082E" />
      <stop offset="100%" stop-color="#B20A3C" />
    </linearGradient>
  </defs>

  <!-- Pure Black Background -->
  <rect width="540" height="1170" fill="#000000" />

  <!-- Top: Kotak 811 Header -->
  <g transform="translate(270, 130)">
    <!-- Kotak text and 811 logo -->
    <text x="-40" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">kotak</text>
    <!-- 811 Badge icon -->
    <g transform="translate(15, -28)">
      <circle cx="20" cy="18" r="18" fill="#DC0032" />
      <path d="M14 13 C12 13 10 15 10 18 C10 21 12 23 14 23 C16 23 18 21 18 18 C18 15 16 13 14 13 Z M26 13 C24 13 22 15 22 18 C22 21 24 23 26 23 C28 23 30 21 30 18 C30 15 28 13 26 13 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
      <line x1="17" y1="18" x2="23" y2="18" stroke="#FFFFFF" stroke-width="2.5" />
    </g>
    <text x="68" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">811</text>
  </g>

  <!-- Subtitle -->
  <text x="270" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#F0F0F0" text-anchor="middle">Scan to pay with any UPI app</text>

  <!-- Main Card Container -->
  <rect x="65" y="295" width="410" height="580" rx="38" fill="url(#kotakCardGrad)" />

  <!-- White QR Container Box -->
  <rect x="88" y="318" width="364" height="364" rx="28" fill="#FFFFFF" />

